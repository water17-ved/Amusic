workflows:
  android-debug-workflow:
    name: Build Android APK
    instance_type: mac_mini_m2 # or linux_x2 if on a free Linux runner
    max_build_duration: 30
    environment:
      android_sdk: 36
      java: 17
    scripts:
      - name: Set up Gradle wrapper executable
        script: |
          chmod +x ./gradlew || true
      - name: Build Android Debug APK
        script: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - vedplayer4@gmail.com
        notify:
          success: true
          failure: true
